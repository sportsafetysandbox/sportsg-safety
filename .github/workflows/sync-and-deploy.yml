name: Sync content and deploy

on:
  schedule:
    - cron: "0 1 * * 1" # weekly, Monday 01:00 UTC (09:00 SGT)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "brandguide/**"
      - "docs/**"
      - "*.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Always runs, but scripts/fetch-notion.js exits cleanly on its own
      # when NOTION_TOKEN is empty — the site still builds and deploys from
      # whatever is currently in src/_data/*.json (placeholders until then).
      # (Can't gate this with `if: secrets.NOTION_TOKEN != ''` — the
      # `secrets` context isn't allowed in `if:` conditions.)
      - name: Sync content from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ABOUT: ${{ vars.NOTION_DB_ABOUT }}
          NOTION_DB_HOME: ${{ vars.NOTION_DB_HOME }}
          NOTION_DB_COMMUNITY: ${{ vars.NOTION_DB_COMMUNITY }}
          NOTION_DB_STAFF_PORTAL: ${{ vars.NOTION_DB_STAFF_PORTAL }}
          NOTION_DB_RESOURCES: ${{ vars.NOTION_DB_RESOURCES }}
          NOTION_DB_TRAINING: ${{ vars.NOTION_DB_TRAINING }}
          NOTION_DB_NEWS: ${{ vars.NOTION_DB_NEWS }}
          NOTION_DB_FAQ: ${{ vars.NOTION_DB_FAQ }}
        run: npm run sync

      - name: Commit updated content if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/_data src/assets/images
          if git diff --staged --quiet; then
            echo "No content changes — skipping commit"
          else
            git commit -m "chore: sync content from Notion $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Build site
        run: npx eleventy

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
